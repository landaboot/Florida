name: Florida (arm64 + iOS)

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "Frida version to build (blank = latest stable frida/frida)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check_version:
    runs-on: ubuntu-22.04
    outputs:
      FRIDA_VERSION: ${{ steps.resolve.outputs.FRIDA_VERSION }}
    steps:
      - name: Resolve Frida version
        id: resolve
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let ver = '${{ github.event.inputs.frida_version }}'.trim();
            if (!ver) {
              const { data } = await github.rest.repos.getLatestRelease({
                owner: 'frida',
                repo: 'frida',
              });
              ver = data.tag_name;
            }
            core.info('Frida version: ' + ver);
            core.setOutput('FRIDA_VERSION', ver);

  create_release:
    needs: check_version
    runs-on: ubuntu-22.04
    steps:
      - name: Create / update release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
          name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
          prerelease: false

  android_build:
    needs: [check_version, create_release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          local-cache: false
          link-to-sdk: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            build-essential tree ninja-build gcc-multilib g++-multilib \
            lib32stdc++-9-dev flex bison ruby ruby-dev python3-requests \
            python3-setuptools python3-dev python3-pip libc6-dev \
            libc6-dev-i386
          sudo gem install fpm -v 1.11.0 --no-document
          python3 -m pip install lief

      - name: Build Frida (Android arm64)
        shell: bash
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          git clone --recurse-submodules \
            --branch "${{ needs.check_version.outputs.FRIDA_VERSION }}" \
            https://github.com/frida/frida
          cd frida
          for path in ../patches/*; do
            name=$(basename "$path")
            real=$(realpath "$path")
            echo "Apply patches in $real to frida/subprojects/$name"
            cd "subprojects/$name"
            git am ../../../patches/$name/*.patch
            cd ../..
          done
          cd ..

          mkdir build-android-arm64
          cd build-android-arm64
          ../frida/configure --host=android-arm64
          make
          cd ..

      - name: Package Android artifacts
        shell: bash
        run: |
          B=build-android-arm64/subprojects
          V=${{ needs.check_version.outputs.FRIDA_VERSION }}
          mkdir -p out
          gzip -c "$B/frida-core/server/frida-server" > "out/florida-server-$V-android-arm64.gz"
          gzip -c "$B/frida-core/inject/frida-inject" > "out/florida-inject-$V-android-arm64.gz"
          gzip -c "$B/frida-core/lib/gadget/frida-gadget.so" > "out/florida-gadget-$V-android-arm64.so.gz"
          gzip -c "$B/frida-gum/bindings/gumjs/libfrida-gumjs-1.0.a" > "out/florida-gumjs-$V-android-arm64.a.gz"

      - name: Upload Android assets to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
          files: out/*

  ios_build:
    needs: [check_version, create_release]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Frida (iOS arm64)
        shell: bash
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --recurse-submodules \
            --branch "${{ needs.check_version.outputs.FRIDA_VERSION }}" \
            https://github.com/frida/frida
          cd frida
          for path in ../patches/*; do
            name=$(basename "$path")
            real=$(realpath "$path")
            echo "Apply patches in $real to frida/subprojects/$name"
            cd "subprojects/$name"
            git am ../../../patches/$name/*.patch
            cd ../..
          done
          cd ..

          mkdir build-ios-arm64
          cd build-ios-arm64
          ../frida/configure --host=ios-arm64
          gmake
          cd ..

      - name: Package iOS artifacts
        shell: bash
        run: |
          B=build-ios-arm64/subprojects
          V=${{ needs.check_version.outputs.FRIDA_VERSION }}
          mkdir -p out
          codesign -vf -s "-" --preserve-metadata=entitlements \
            "$B/frida-core/server/frida-server" || true
          gzip -c "$B/frida-core/server/frida-server" > "out/florida-server-$V-ios-arm64.gz"
          gzip -c "$B/frida-core/inject/frida-inject" > "out/florida-inject-$V-ios-arm64.gz"
          gzip -c "$B/frida-core/lib/gadget/frida-gadget.dylib" > "out/florida-gadget-$V-ios-arm64.dylib.gz"
          gzip -c "$B/frida-gum/bindings/gumjs/libfrida-gumjs-1.0.a" > "out/florida-gumjs-$V-ios-arm64.a.gz"

      - name: Upload iOS assets to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
          files: out/*
